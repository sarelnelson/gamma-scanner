<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>Gamma Scanner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.login-box { background: #161b22; border: 1px solid #21262d; border-radius: 16px; padding: 40px; max-width: 360px; width: 100%; text-align: center; }
.login-box h1 { font-size: 24px; margin-bottom: 8px; }
.login-box .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 28px; }
.login-box input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 16px; margin-bottom: 16px; -webkit-appearance: none; }
.login-box input:focus { outline: none; border-color: #1f6feb; }
.login-box button { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #1f6feb; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
.login-box button:hover { background: #388bfd; }
.login-box .error { color: #f85149; font-size: 13px; margin-top: 12px; display: none; }
.user-select { display: none; margin-top: 20px; }
.user-btn { width: 100%; padding: 16px; border-radius: 10px; border: 1px solid #30363d; background: #0d1117; color: #e6edf3; font-size: 18px; font-weight: 600; cursor: pointer; margin-bottom: 10px; text-align: left; display: flex; align-items: center; gap: 12px; }
.user-btn:hover { border-color: #1f6feb; background: #161b22; }
.user-btn .avatar { width: 36px; height: 36px; border-radius: 50%; background: #1f6feb; display: flex; align-items: center; justify-content: center; font-size: 16px; }
</style>
</head>
<body>
<div class="login-box">
  <h1>🎯 Gamma Scanner</h1>
  <p class="subtitle">Enter password to continue</p>
  
  <div id="password-step">
    <input type="text" id="devname" placeholder="Your name (e.g. Sarel's iPhone)">
    <input type="password" id="password" placeholder="Password" autofocus>
    <button onclick="checkPassword()">Enter</button>
    <p class="error" id="error">Incorrect password</p>
  </div>

  <div id="gate-info" style="color:#8b949e;font-size:12px;margin-top:14px;"></div>

  <details style="margin-top:16px;text-align:left;">
    <summary style="color:#8b949e;font-size:12px;cursor:pointer;">Admin</summary>
    <input type="password" id="master" placeholder="Master password" style="margin-top:10px;">
    <div style="display:flex;gap:8px;align-items:center;">
      <select id="open-hours" style="flex:0 0 auto;padding:12px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:14px;">
        <option value="1">1h</option>
        <option value="3" selected>3h</option>
        <option value="24">24h</option>
      </select>
      <button onclick="gate('open')" style="flex:1;">Open</button>
      <button onclick="gate('lock')" style="flex:1;background:#30363d;">Lock</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button onclick="loadDevices()" style="flex:1;background:#30363d;">Devices</button>
      <button onclick="revokeAll()" style="flex:1;background:#5a1d1d;">Revoke all</button>
    </div>
    <div id="devices" style="margin-top:10px;font-size:12px;color:#8b949e;"></div>
    <p id="gate-msg" style="color:#8b949e;font-size:12px;margin-top:8px;"></p>
  </details>
</div>

<script>
document.getElementById('password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') checkPassword();
});

// If we already have access (valid whitelist cookie, or gate off), skip the form.
// Uses a background request — never a blind redirect — so there's no login<->dashboard loop.
fetch('/api/session').then(function(r) {
  if (r.ok) window.location.href = '/dashboard';
}).catch(function() {});

async function checkPassword() {
  const pw = document.getElementById('password').value;
  const nameEl = document.getElementById('devname');
  const name = nameEl ? nameEl.value : '';
  const err = document.getElementById('error');
  try {
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw, name: name})
    });
    const data = await resp.json();
    if (data.success) {
      localStorage.setItem('gamma_user', 'scanner');
      if (data.token) localStorage.setItem('gamma_token', data.token);
      window.location.href = '/dashboard';
      return;
    }
    err.textContent = (data.reason === 'locked')
      ? (data.message || 'Access is locked. Ask the admin to open the gate.')
      : 'Incorrect password';
    err.style.display = 'block';
  } catch (e) {
    err.textContent = 'Login failed — try again';
    err.style.display = 'block';
  }
}

async function gate(action) {
  const mp = document.getElementById('master').value;
  const msg = document.getElementById('gate-msg');
  const body = {password: mp};
  if (action === 'open') body.hours = parseFloat(document.getElementById('open-hours').value);
  try {
    const r = await fetch('/api/gate/' + action, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    msg.textContent = d.success
      ? (d.open ? ('Gate OPEN — ' + Math.round(d.seconds_remaining/60) + ' min left') : 'Gate LOCKED')
      : (d.error || 'Failed');
  } catch (e) { msg.textContent = 'Failed'; }
  loadGateStatus();
}

async function loadDevices() {
  const mp = document.getElementById('master').value;
  const el = document.getElementById('devices');
  try {
    const r = await fetch('/api/gate/devices', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: mp})
    });
    const d = await r.json();
    if (!d.success) { el.textContent = d.error || 'Failed'; return; }
    if (!d.count) { el.textContent = 'No enrolled devices.'; return; }
    el.innerHTML = d.devices.map(function(dev) {
      var seen = dev.last_seen ? new Date(dev.last_seen * 1000).toLocaleString() : '?';
      var primary = dev.name || dev.device || 'Unknown device';
      var secondary = (dev.name && dev.device ? dev.device + ' \u00b7 ' : '') + (dev.label || '?');
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #21262d;">'
        + '<span><strong>' + primary + '</strong><br><span style="color:#586069;">' + secondary + ' \u00b7 last seen ' + seen + '</span></span>'
        + '<button onclick="revokeDevice(\'' + dev.token + '\')" style="width:auto;padding:6px 10px;background:#5a1d1d;font-size:11px;">Revoke</button>'
        + '</div>';
    }).join('');
  } catch (e) { el.textContent = 'Failed'; }
}

async function revokeDevice(token) {
  const mp = document.getElementById('master').value;
  await fetch('/api/gate/revoke', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: mp, token: token})
  });
  loadDevices();
}

async function revokeAll() {
  if (!confirm('Revoke ALL devices? Everyone (including you) will need to re-enroll.')) return;
  const mp = document.getElementById('master').value;
  const r = await fetch('/api/gate/revoke-all', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: mp})
  });
  const d = await r.json();
  document.getElementById('gate-msg').textContent = d.success ? ('Revoked ' + d.revoked + ' device(s)') : (d.error || 'Failed');
  loadDevices();
}

async function loadGateStatus() {
  try {
    const r = await fetch('/api/gate/status');
    const d = await r.json();
    const el = document.getElementById('gate-info');
    if (!d.enabled) { el.textContent = ''; return; }
    el.textContent = d.open
      ? ('🔓 Gate open — ' + Math.round(d.seconds_remaining/60) + ' min left (new devices can join)')
      : '🔒 Locked — existing devices only';
  } catch (e) {}
}
loadGateStatus();
</script>
</body>
</html>
