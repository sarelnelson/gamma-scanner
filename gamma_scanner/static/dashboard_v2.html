<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f0d">
<title>Chameleon</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8faf9;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-solid: #ffffff;
  --border: rgba(16, 185, 129, 0.15);
  --green: #0d9668;
  --green-soft: #10b981;
  --green-dim: rgba(16, 185, 129, 0.08);
  --red: #dc2626;
  --text: #1a2e28;
  --text2: #4a6358;
  --muted: #7a9e8e;
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top);
}

/* Watercolor chameleon background */
.bg-art {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

/* Full composition as background */
.bg-chameleon {
  position: absolute;
  inset: 0;
  background: url('/static/chameleon_bg.png') center center/cover no-repeat;
}

/* Content layer */
.content {
  position: relative;
  z-index: 1;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
}
.wordmark {
  height: 48px;
}
.wordmark img {
  height: 100%;
  width: auto;
}
.menu-btn {
  width: 40px; height: 40px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  backdrop-filter: blur(8px);
}
.menu-btn span { display:block; width:16px; height:1.5px; background:var(--text2); border-radius:1px; }

/* Hero */
.hero {
  padding: 60px 24px 40px;
  text-align: center;
}
.hero-label {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.hero-value {
  font-size: 56px;
  font-weight: 700;
  letter-spacing: -3px;
  line-height: 1;
}
.hero-value.up { color: var(--green); }
.hero-value.down { color: var(--red); }
.hero-badges {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 16px;
}
.hero-badge {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  background: var(--surface);
  border: 1px solid var(--border);
  backdrop-filter: blur(8px);
}
.hero-badge .val { font-weight: 600; }
.hero-badge .val.up { color: var(--green); }
.hero-badge .val.down { color: var(--red); }

/* Glass panels */
.panel {
  margin: 0 20px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  text-align: center;
}
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 20px; font-weight: 700; }

/* Positions */
.pos-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid rgba(16,185,129,0.06);
}
.pos-item:last-child { border-bottom: none; }
.pos-ticker { font-size: 16px; font-weight: 600; }
.pos-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
.pos-pnl { font-size: 16px; font-weight: 700; text-align: right; }
.pos-pnl.up { color: var(--green); }
.pos-pnl.down { color: var(--red); }
.pos-pct { font-size: 11px; color: var(--text2); text-align: right; }

/* Section titles */
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.section-title { font-size: 14px; font-weight: 600; }
.section-count { font-size: 11px; color: var(--muted); }

/* Menu overlay */
.overlay { display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); }
.overlay.open { display:block; }
.slide-panel {
  position:absolute; top:0; right:0; width:260px; height:100%;
  background: #ffffff;
  border-left: 1px solid var(--border);
  padding: 24px;
  overflow-y: auto;
  box-shadow: -4px 0 24px rgba(0,0,0,0.1);
}
.slide-panel h4 { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin:24px 0 10px; }
.slide-panel h4:first-child { margin-top:0; }
.slide-item {
  padding: 11px 14px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  margin-bottom: 2px;
}
.slide-item:hover { background: var(--green-dim); color: var(--text); }
.slide-item.active { background: var(--green-dim); color: var(--green); }
.close-x { position:absolute; top:16px; right:16px; font-size:20px; color:var(--muted); cursor:pointer; }
</style>
</head>
<body>

<div class="bg-art">
  <div class="bg-chameleon"></div>
</div>

<div class="content">
  <div class="header">
    <div class="wordmark"><img src="/static/logo.png" alt="Chameleon"></div>
    <button class="menu-btn" onclick="openMenu()"><span></span><span></span><span></span></button>
  </div>

  <div class="hero">
    <div class="hero-label" id="h-label">Portfolio</div>
    <div class="hero-value up" id="h-val">$0</div>
    <div class="hero-badges">
      <div class="hero-badge">Today <span class="val up" id="h-daily">—</span></div>
      <div class="hero-badge"><span id="h-count">0</span> positions</div>
    </div>
  </div>

  <div class="panel">
    <div class="stats-grid">
      <div><div class="stat-label">Realized</div><div class="stat-value" id="s-real">$1,187</div></div>
      <div><div class="stat-label">Win Rate</div><div class="stat-value" id="s-wr">100%</div></div>
      <div><div class="stat-label">Record</div><div class="stat-value" id="s-rec">6/0</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="section-head">
      <div class="section-title">Positions</div>
      <div class="section-count" id="p-count">21 open</div>
    </div>
    <div id="positions"></div>
  </div>
</div>

<!-- Menu -->
<div class="overlay" id="ov" onclick="closeMenu()">
  <div class="slide-panel" onclick="event.stopPropagation()">
    <div class="close-x" onclick="closeMenu()">×</div>
    <h4>Account</h4>
    <div class="slide-item active" onclick="sw('scanner')">Scanner</div>
    <div class="slide-item" onclick="sw('puts')">Reversal Puts</div>
    <div class="slide-item" onclick="sw('sarel')">Sarel</div>
    <div class="slide-item" onclick="sw('yonah')">Yonah</div>
    <h4>Actions</h4>
    <div class="slide-item" onclick="closeMenu()">Run Scan</div>
    <div class="slide-item" onclick="closeMenu()">Fund Account</div>
    <div class="slide-item" onclick="closeMenu()">Pause</div>
    <div class="slide-item" onclick="closeMenu()">Security Gate</div>
  </div>
</div>

<script>
let user = 'scanner';
function openMenu(){document.getElementById('ov').classList.add('open')}
function closeMenu(){document.getElementById('ov').classList.remove('open')}
function sw(u){user=u;closeMenu();load();}

async function load(){
  try{
    const[pR,dR,aR]=await Promise.all([
      fetch(`/api/performance?user=${user}`),
      user!=='puts'?fetch(`/api/daily-move?user=${user}`):null,
      user!=='puts'?fetch(`/api/alpaca-pnl?user=${user}`):null,
    ]);
    const p=await pR.json(), s=p.loose||{}, t=s.trades||[], op=t.filter(x=>x.status==='open');
    
    // Hero: account balance for live users, P&L for paper
    const isLive = (user === 'sarel' || user === 'yonah');
    let heroVal = 0;
    
    if (isLive) {
      // Show account equity
      try {
        const acctR = await fetch(`/api/account?user=${user}`);
        if (acctR.ok) {
          const acct = await acctR.json();
          heroVal = acct.broker_equity || 0;
        }
      } catch(e) {}
      document.getElementById('h-label').textContent = 'Account Balance';
      document.getElementById('h-val').textContent = `$${heroVal.toLocaleString(undefined,{maximumFractionDigits:0})}`;
      document.getElementById('h-val').className = 'hero-value up';
    } else {
      // Show unrealized P&L
      let unr = s.open_pnl || 0;
      if(aR&&aR.ok){unr=(await aR.json()).unrealized_pl||unr;}
      heroVal = unr;
      document.getElementById('h-label').textContent = 'Unrealized P&L';
      document.getElementById('h-val').textContent = `${unr>=0?'+':'-'}$${Math.abs(unr).toLocaleString(undefined,{maximumFractionDigits:0})}`;
      document.getElementById('h-val').className = 'hero-value '+(unr>=0?'up':'down');
    }
    
    if(dR&&dR.ok){const d=(await dR.json()).total||0;const e=document.getElementById('h-daily');e.textContent=`${d>=0?'+':''}$${d.toFixed(0)}`;e.className='val '+(d>=0?'up':'down');}
    document.getElementById('h-count').textContent=op.length;
    document.getElementById('s-real').textContent=`$${(s.total_pnl||0).toFixed(0)}`;
    document.getElementById('s-wr').textContent=`${s.win_rate||0}%`;
    document.getElementById('s-rec').textContent=`${s.wins||0}/${s.losses||0}`;
    document.getElementById('p-count').textContent=`${op.length} open`;
    op.sort((a,b)=>(b.current_pnl||0)-(a.current_pnl||0));
    document.getElementById('positions').innerHTML=op.map(x=>{
      const pnl=x.current_pnl||0,e=x.option_cost||0,b=x.current_option_bid,pc=b&&e>0?((b-e)/e*100).toFixed(0):'—';
      return`<div class="pos-item"><div><div class="pos-ticker">${x.ticker||'?'} <span style="font-size:11px;color:var(--muted)">${x.direction||''} $${x.option_strike||''}</span></div><div class="pos-detail">$${e.toFixed(2)} → $${b?.toFixed(2)||'—'}</div></div><div><div class="pos-pnl ${pnl>=0?'up':'down'}">${pnl>=0?'+':''}$${Math.abs(pnl).toFixed(0)}</div><div class="pos-pct">${pc}%</div></div></div>`;
    }).join('')||'<div style="color:var(--muted);padding:20px 0;font-size:13px;">No positions</div>';
  }catch(e){console.error(e);}
}
load();setInterval(load,30000);
</script>
</body>
</html>
