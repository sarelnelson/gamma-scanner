services:
  gamma-scanner:
    build:
      context: .
      dockerfile: Dockerfile.gamma
    container_name: gamma-scanner
    ports:
      - "80:8081"
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY:-PKOMKRLONHFRTJIPY3OTSRQYDP}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-85eucWnKfY5DmBxCiWP3uTefYMbLdwn7D7fjTSpbNGx4}
      - NTFY_TOPIC=${NTFY_TOPIC:-Leras2468}
      - PORT=8081
      - GAMMA_DATA_DIR=/app/data
      - LIVE_EXECUTION=true
    volumes:
      - gamma_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/last-scan', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  gamma_data:
    driver: local
